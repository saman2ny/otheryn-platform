# DentalPilot AI — Local development stack (Docker only)
#
# This is the ONLY supported local development workflow. It builds images from
# the real Dockerfiles and runs:
#   postgres 16 → migrate (one-shot) → backend (uvicorn --reload) → workers
#   frontend (Angular dev server with HMR)
#
# No host Node.js, npm, Python, pip, PostgreSQL or Redis installation is needed.
#
# Usage:
#   cp .env.local.example .env.local   # then edit secrets
#   docker compose -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.local.yml logs -f backend frontend workers

name: dentalpilot-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: dentalpilot-local-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dentalpilot}
      POSTGRES_USER: ${POSTGRES_USER:-dentalpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dentalpilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dentalpilot} -d ${POSTGRES_DB:-dentalpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - dentalpilot-local

  # One-shot migration runner. Backend and workers wait for this to complete
  # successfully, so `alembic upgrade head` runs exactly once per `up`.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dentalpilot-backend:local
    container_name: dentalpilot-local-migrate
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dentalpilot}:${POSTGRES_PASSWORD:-dentalpilot}@postgres:5432/${POSTGRES_DB:-dentalpilot}
      APP_ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - dentalpilot-local

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dentalpilot-backend:local
    container_name: dentalpilot-local-backend
    # No `alembic upgrade head` here — migrations are handled by the `migrate`
    # service so they are not executed by every backend/worker start.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dentalpilot}:${POSTGRES_PASSWORD:-dentalpilot}@postgres:5432/${POSTGRES_DB:-dentalpilot}
      APP_ENVIRONMENT: development
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # Hot reload: mount source over the image copy.
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/scripts:/app/scripts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - dentalpilot-local

  workers:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dentalpilot-backend:local
    container_name: dentalpilot-local-workers
    command: ["python", "-m", "app.workers.run_workers"]
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dentalpilot}:${POSTGRES_PASSWORD:-dentalpilot}@postgres:5432/${POSTGRES_DB:-dentalpilot}
      APP_ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend/app:/app/app
    # The backend image defines an HTTP HEALTHCHECK; workers do not serve HTTP.
    healthcheck:
      disable: true
    restart: unless-stopped
    networks:
      - dentalpilot-local

  # Angular development server with HMR. The source is bind-mounted; a named
  # volume caches node_modules. `--poll 1000` makes file watching reliable on
  # macOS Docker Desktop.
  frontend:
    image: node:22-alpine
    container_name: dentalpilot-local-frontend
    working_dir: /app
    command: sh -c "[ -x node_modules/.bin/ng ] || npm ci --no-audit --no-fund; npm start -- --host 0.0.0.0 --port 4200 --poll 1000"
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4200 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - dentalpilot-local

volumes:
  postgres_local_data:
  frontend_node_modules:

networks:
  dentalpilot-local:
    driver: bridge