# DentalPilot AI — Local development stack
name: dentalpilot-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: dentalpilot-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env.local}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env.local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - dentalpilot-local

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dentalpilot-backend:local
    container_name: dentalpilot-local-migrate
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env.local
    environment:
      DATABASE_URL: ""
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env.local}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env.local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.local}
      APP_ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - dentalpilot-local

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dentalpilot-backend:local
    container_name: dentalpilot-local-backend
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "app"
      ]
    env_file:
      - .env.local
    environment:
      DATABASE_URL: ""
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env.local}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env.local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.local}
      APP_ENVIRONMENT: development
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - dentalpilot-local

  workers:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dentalpilot-backend:local
    container_name: dentalpilot-local-workers
    command: ["python", "-m", "app.workers.run_workers"]
    env_file:
      - .env.local
    environment:
      DATABASE_URL: ""
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env.local}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env.local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env.local}
      APP_ENVIRONMENT: development
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Workers do not serve HTTP; disable inherited backend image healthcheck.
    healthcheck:
      disable: true
    restart: unless-stopped
    networks:
      - dentalpilot-local

  frontend:
    image: node:22-alpine
    container_name: dentalpilot-local-frontend
    working_dir: /app
    command:
      - sh
      - -c
      - "[ -x node_modules/.bin/ng ] || npm ci --no-audit --no-fund; npm start -- --host 0.0.0.0 --port 4200 --poll 1000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4200 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - dentalpilot-local

networks:
  dentalpilot-local:
    name: dentalpilot-local_dentalpilot-local
    driver: bridge

volumes:
  postgres_local_data:
    name: dentalpilot-local_postgres_local_data
  frontend_node_modules:
    name: dentalpilot-local_frontend_node_modules
