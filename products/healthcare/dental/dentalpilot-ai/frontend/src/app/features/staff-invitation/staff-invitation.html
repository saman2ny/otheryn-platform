<main class="min-h-screen bg-[#f7f6f1] px-4 py-10 text-zinc-900">
  <section class="mx-auto max-w-lg rounded-xl border border-zinc-200 bg-white p-6">
    <a href="/auth/login" class="text-xs font-semibold tracking-[0.18em] text-teal-800 uppercase">
      DentalPilot AI
    </a>
    <h1 class="mt-5 text-2xl font-semibold">Join your clinic team</h1>
    <p class="mt-2 text-sm leading-6 text-zinc-600">
      Use the one-time invitation token from your clinic to activate your staff account.
    </p>
    @if (accepted()) {
      <a
        class="mt-5 inline-flex rounded-md bg-teal-800 px-4 py-2 text-sm font-semibold text-white"
        href="/auth/login"
      >
        Continue to sign in
      </a>
    } @else {
      <label class="mt-5 grid gap-1 text-sm font-medium">
        Invitation token
        <input
          class="rounded-md border border-zinc-300 px-3 py-2 font-normal"
          [value]="token()"
          (input)="updateToken($event)"
          autocomplete="one-time-code"
        />
      </label>
      <label class="mt-3 grid gap-1 text-sm font-medium">
        Create password
        <input
          class="rounded-md border border-zinc-300 px-3 py-2 font-normal"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="staffPassword"
          type="password"
          autocomplete="new-password"
          placeholder="At least 12 characters"
        />
      </label>
      <button
        type="button"
        class="mt-4 rounded-md bg-teal-800 px-4 py-2 text-sm font-semibold text-white"
        [disabled]="saving()"
        (click)="acceptInvitation()"
      >
        {{ saving() ? 'Activating…' : 'Accept invitation' }}
      </button>
    }
  </section>
</main>
