<div class="fixed top-6 right-6 z-[1000] flex flex-col gap-2">
  @for (toast of notifications.notifications(); track toast.id) {
    <div
      class="flex min-w-[280px] max-w-[360px] items-center gap-4 rounded-md border border-l-[3px] border-zinc-200 bg-white px-4 py-3 text-sm font-medium text-zinc-900 shadow-sm"
      [class.border-l-green-600]="toast.kind === 'success'"
      [class.border-l-red-600]="toast.kind === 'error'"
      [class.border-l-teal-700]="toast.kind === 'info'"
    >
      <span>{{ toast.message }}</span>
      <button
        type="button"
        aria-label="Dismiss"
        class="ml-auto cursor-pointer border-none bg-transparent text-base text-zinc-400 opacity-70 hover:opacity-100"
        (click)="notifications.dismiss(toast.id)"
      >
        &times;
      </button>
    </div>
  }
</div>
