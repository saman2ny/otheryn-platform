<div class="rounded-lg border border-dashed border-zinc-200 bg-white px-6 py-12 text-center">
  <div class="mb-2 text-3xl">{{ icon() }}</div>
  <h3 class="mb-1 text-base font-semibold text-zinc-900">{{ title() }}</h3>
  @if (message()) {
    <p class="mx-auto mb-4 max-w-sm text-zinc-500">{{ message() }}</p>
  }
  @if (actionLabel()) {
    <button
      type="button"
      class="rounded-md bg-teal-700 px-[18px] py-2.5 text-sm font-semibold text-white transition-colors hover:bg-teal-800"
      (click)="action.emit()"
    >
      {{ actionLabel() }}
    </button>
  }
</div>
