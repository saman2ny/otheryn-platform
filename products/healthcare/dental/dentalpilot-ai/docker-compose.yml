version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: dentalpilot-postgres
    environment:
      POSTGRES_DB: dentalpilot
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d dentalpilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dentalpilot-network

  # Redis for caching/sessions (optional but recommended)
  redis:
    image: redis:7-alpine
    container_name: dentalpilot-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dentalpilot-network

  # Backend API
  backend:
    image: ${REGISTRY}/${IMAGE_NAME}-backend:latest
    container_name: dentalpilot-backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/dentalpilot
      APP_ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      CORS_ORIGINS: '["https://dentalpilot.in", "https://www.dentalpilot.in"]'
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: claude-opus-4-8
      CLINICAL_NOTE_DRAFTING_ENABLED: "false"
      CLINICAL_AI_DATA_PROCESSING_APPROVED: "false"
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      RAZORPAY_CURRENCY: INR
      RAZORPAY_PLAN_IDS: ${RAZORPAY_PLAN_IDS}
      SUBSCRIPTION_GRACE_PERIOD_DAYS: 7
      BILLING_WEBHOOK_INTERVAL_SECONDS: 5
      BILLING_WEBHOOK_MAX_ATTEMPTS: 10
      SUBSCRIPTION_RECONCILIATION_INTERVAL_SECONDS: 3600
      PATIENT_PAYMENT_CURRENCY: INR
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_KMS_KEY_ID: ${S3_KMS_KEY_ID}
      MAX_PATIENT_DOCUMENT_BYTES: 25000000
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SENDER_EMAIL: ${SMTP_SENDER_EMAIL}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-DentalPilot AI}
      SMTP_USE_SSL: "false"
      SMTP_USE_STARTTLS: "true"
      EMAIL_WORKER_INTERVAL_SECONDS: 10
      EMAIL_MAX_ATTEMPTS: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - dentalpilot-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Background Workers
  workers:
    image: ${REGISTRY}/${IMAGE_NAME}-backend:latest
    container_name: dentalpilot-workers
    command: python -m app.workers.run_workers
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/dentalpilot
      APP_ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      RAZORPAY_CURRENCY: INR
      SUBSCRIPTION_GRACE_PERIOD_DAYS: 7
      BILLING_WEBHOOK_INTERVAL_SECONDS: 5
      BILLING_WEBHOOK_MAX_ATTEMPTS: 10
      SUBSCRIPTION_RECONCILIATION_INTERVAL_SECONDS: 3600
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SENDER_EMAIL: ${SMTP_SENDER_EMAIL}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-DentalPilot AI}
      SMTP_USE_SSL: "false"
      SMTP_USE_STARTTLS: "true"
      EMAIL_WORKER_INTERVAL_SECONDS: 10
      EMAIL_MAX_ATTEMPTS: 5
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dentalpilot-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Frontend (Nginx)
  frontend:
    image: ${REGISTRY}/${IMAGE_NAME}-frontend:latest
    container_name: dentalpilot-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - dentalpilot-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

volumes:
  postgres_data:
  redis_data:

networks:
  dentalpilot-network:
    driver: bridge