# DentalPilot AI — Production stack
#
# Images are pulled from GHCR (built by .github/workflows/ci-cd.yml). Set
# IMAGE_TAG to an immutable tag (sha-<commit> or a release tag) for
# reproducible deploys; it defaults to `latest` for convenience.
#
# Migrations are executed by the one-shot `migrate` service before backend and
# workers start, so `alembic upgrade head` runs exactly once per deployment.
#
# Usage:
#   docker compose pull
#   docker compose up -d --remove-orphans

name: dentalpilot

services:
  postgres:
    image: postgres:16-alpine
    container_name: dentalpilot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dentalpilot}
      POSTGRES_USER: ${POSTGRES_USER:-dentalpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dentalpilot} -d ${POSTGRES_DB:-dentalpilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dentalpilot-net

  # One-shot migration runner. Backend and workers wait for successful
  # completion, so migrations are applied exactly once and before traffic.
  migrate:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-your-org/dentalpilot-ai}-backend:${IMAGE_TAG:-latest}
    container_name: dentalpilot-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-dentalpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-dentalpilot}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - dentalpilot-net

  backend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-your-org/dentalpilot-ai}-backend:${IMAGE_TAG:-latest}
    container_name: dentalpilot-backend
    # Migrations are handled by the one-shot `migrate` service, not on every boot.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-dentalpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-dentalpilot}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://dentalpilot.in"]}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      CLINICAL_NOTE_DRAFTING_ENABLED: ${CLINICAL_NOTE_DRAFTING_ENABLED:-false}
      CLINICAL_AI_DATA_PROCESSING_APPROVED: ${CLINICAL_AI_DATA_PROCESSING_APPROVED:-false}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_CURRENCY: ${RAZORPAY_CURRENCY:-INR}
      RAZORPAY_PLAN_IDS: ${RAZORPAY_PLAN_IDS:-{}}
      PATIENT_PAYMENT_CURRENCY: ${PATIENT_PAYMENT_CURRENCY:-INR}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
      MAX_PATIENT_DOCUMENT_BYTES: ${MAX_PATIENT_DOCUMENT_BYTES:-25000000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER_EMAIL: ${SMTP_SENDER_EMAIL:-}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-DentalPilot AI}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_USE_STARTTLS: ${SMTP_USE_STARTTLS:-true}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      SUBSCRIPTION_GRACE_PERIOD_DAYS: ${SUBSCRIPTION_GRACE_PERIOD_DAYS:-7}
      BILLING_WEBHOOK_INTERVAL_SECONDS: ${BILLING_WEBHOOK_INTERVAL_SECONDS:-5}
      BILLING_WEBHOOK_MAX_ATTEMPTS: ${BILLING_WEBHOOK_MAX_ATTEMPTS:-10}
      SUBSCRIPTION_RECONCILIATION_INTERVAL_SECONDS: ${SUBSCRIPTION_RECONCILIATION_INTERVAL_SECONDS:-3600}
      EMAIL_WORKER_INTERVAL_SECONDS: ${EMAIL_WORKER_INTERVAL_SECONDS:-10}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./exports:/app/exports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - dentalpilot-net

  workers:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-your-org/dentalpilot-ai}-backend:${IMAGE_TAG:-latest}
    container_name: dentalpilot-workers
    command: ["python", "-m", "app.workers.run_workers"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-dentalpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-dentalpilot}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_CURRENCY: ${RAZORPAY_CURRENCY:-INR}
      RAZORPAY_PLAN_IDS: ${RAZORPAY_PLAN_IDS:-{}}
      PATIENT_PAYMENT_CURRENCY: ${PATIENT_PAYMENT_CURRENCY:-INR}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER_EMAIL: ${SMTP_SENDER_EMAIL:-}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-DentalPilot AI}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_USE_STARTTLS: ${SMTP_USE_STARTTLS:-true}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      SUBSCRIPTION_GRACE_PERIOD_DAYS: ${SUBSCRIPTION_GRACE_PERIOD_DAYS:-7}
      BILLING_WEBHOOK_INTERVAL_SECONDS: ${BILLING_WEBHOOK_INTERVAL_SECONDS:-5}
      BILLING_WEBHOOK_MAX_ATTEMPTS: ${BILLING_WEBHOOK_MAX_ATTEMPTS:-10}
      SUBSCRIPTION_RECONCILIATION_INTERVAL_SECONDS: ${SUBSCRIPTION_RECONCILIATION_INTERVAL_SECONDS:-3600}
      EMAIL_WORKER_INTERVAL_SECONDS: ${EMAIL_WORKER_INTERVAL_SECONDS:-10}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./exports:/app/exports
    # Workers do not serve HTTP; disable the backend image's HTTP healthcheck.
    healthcheck:
      disable: true
    restart: unless-stopped
    networks:
      - dentalpilot-net

  frontend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-your-org/dentalpilot-ai}-frontend:${IMAGE_TAG:-latest}
    container_name: dentalpilot-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - dentalpilot-net

volumes:
  postgres_data:

networks:
  dentalpilot-net:
    driver: bridge